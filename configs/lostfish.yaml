# All tunables live here. Pin engine versions so results are reproducible.
engines:
  stockfish: engines/stockfish          # set by scripts/setup_engines.sh
  stockfish_version: "19"              # sf_19 tag; also pinned in scripts/setup_engines.sh
  fastchess: engines/fastchess
  fastchess_version: "1.8.2-alpha"
  syzygy_path: tb/syzygy
  hash_mb: 64
  threads: 1

certify:
  multipv: 5                 # K candidates
  tolerance_cp: 30           # candidates within this many cp of the best move
  tolerance_min_cp: 0
  tighten_when_behind_cp: 150

steer:
  lambda_weakness: 0.15      # weight of profile weakness-match relative to expected eval
  proxy_depth_cap: 12

budgets:                     # nodes per move by time control class
  bullet:   { certify_nodes: 200000,  eval_nodes: 50000,  k: 3, proxy_depth_cap: 8 }
  blitz:    { certify_nodes: 600000,  eval_nodes: 150000, k: 5, proxy_depth_cap: 12 }
  rapid:    { certify_nodes: 1500000, eval_nodes: 400000, k: 6, proxy_depth_cap: 14 }

timeman:
  moves_to_go_assumed: 30
  increment_fraction: 0.8
  min_move_ms: 50
  reserve_ms: 300

profiles:
  dir: profiles
  fallback: _generic
