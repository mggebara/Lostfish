# Step 3b: PREDICTOR-ONLY steering. Certified candidates scored as cp + 300 * P(victim blunders after the move) from the
# victim-error predictor; deviate when that beats Stockfish's best by >= 20 cp. No exact victim model, ~ms per move.
# Same openings (srand 20261021) as lc0_long_n200_{control,tree2}: pair by Round.
# Question: does the learned signal alone steer, at ~zero cost?
rounds = 100
games = 2
concurrency = 5
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261021
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5

[each]

[[engine]]
name = "LostFish-v2-pred-steer"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_pred_steer.yaml"
nodes = 20000
[engine.options]
Steering = true
Profile = "lc0-t1"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-t1-n200"
cmd = "engines/lc0"
nodes = 200
[engine.options]
WeightsFile = "{root}/engines/lc0nets/t1-256x10-distilled-swa-2432500.pb.gz"
Threads = 1
