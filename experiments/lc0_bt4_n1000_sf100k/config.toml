# Certifier ladder vs the largest net (DECISIONS 2026-10-26 23:xx): plain Stockfish 19 @100k nodes vs lc0 BT4 @1000 nodes.
# Finds the Stockfish budget at parity with BT4@1000, which sets the certify/eval budget the exploit tree needs
# against it (Stockfish@20k scored 27.0 % in lc0_bt4_n1000_stockfish). Same openings/srand as the other BT4 matches.
rounds = 100
games = 2
concurrency = 3
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261025
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5

[each]

[[engine]]
name = "Stockfish-100k"
cmd = "engines/stockfish"
nodes = 100000
[engine.options]
Threads = 1
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-bt4-n1000"
cmd = "engines/lc0"
nodes = 1000
[engine.options]
WeightsFile = "{root}/engines/lc0nets/BT4-1024x15x32h-swa-6147500-policytune-332.pb.gz"
Threads = 1
BackendOptions = "max_batch=256"
