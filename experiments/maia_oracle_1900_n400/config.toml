# Maia oracle: the opponent is lc0 + maia-1900 at 400 node(s); LostFish's proxy uses the same net (profile
# maia-1900), so at 1 node the reply prediction is exact. Seeds at 100000 nodes (bullet-class budgets) to leave
# some headroom below the ceiling. Stockfish is the matched baseline. 32 rounds x 2 games per seed.
rounds = 32
games = 2
concurrency = 4
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261019
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5
extra_args = ["-tournament", "gauntlet", "-seeds", "2"]

[each]
# nodes are per engine (a shared [each] nodes overrides per-engine limits)

[[engine]]
name = "LostFish-maia1900"
cmd = "scripts/lostfish"
nodes = 100000
[engine.options]
Steering = true
Profile = "maia-1900"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "Stockfish"
cmd = "engines/stockfish"
nodes = 100000
[engine.options]
Threads = 1
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "maia-1900-n400"
cmd = "engines/lc0"
nodes = 400
[engine.options]
WeightsFile = "{root}/engines/maia/maia-1900.pb.gz"
Threads = 1
