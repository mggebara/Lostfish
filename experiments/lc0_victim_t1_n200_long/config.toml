# Long rerun of the N_v=200 exploitability point. The 8-round run (16 games per pairing, +-19) put the exact-model
# tree seed at 65.6% vs the control's 87.5% against lc0@200, while its deviations looked locally profitable in
# telemetry (+33 cp realised vs +3 baseline). Settle it: gauntlet, seeds Stockfish / v2 control / v2 + victim-play
# tree (depth 2, width 2, min_gain 50, EXACT victim model lc0@200) vs lc0 T1 @200. 100 rounds x 2 = 200 games per
# seed (+-5-6 at these score levels). Tree seed ~4.8 s/move -> ~6 h at concurrency 5.
rounds = 100
games = 2
concurrency = 5
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261021
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5
extra_args = ["-tournament", "gauntlet", "-seeds", "3"]

[each]

[[engine]]
name = "LostFish-v2-tol0"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_tol0.yaml"
nodes = 20000
[engine.options]
Steering = true
Profile = "lc0-t1"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "LostFish-v2-tree2-exact"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_tree2_g50.yaml"
nodes = 20000
[engine.options]
Steering = true
Profile = "lc0-t1-n200"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "Stockfish"
cmd = "engines/stockfish"
nodes = 20000
[engine.options]
Threads = 1
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-t1-n200"
cmd = "/opt/homebrew/bin/lc0"
nodes = 200
[engine.options]
WeightsFile = "{root}/engines/lc0nets/t1-256x10-distilled-swa-2432500.pb.gz"
Threads = 1
