# Step 3a: PREDICTOR-GATED exact tree. Same as lc0_long_n200_tree2 (victim-play tree, exact victim model lc0@200) but the
# 230x-cost tree runs only when the victim-error predictor (experiments/victim_error_v1) rates a certified candidate's
# child position in the top ~15% of risk. Same openings (srand 20261021) as lc0_long_n200_{control,tree2}: pair by Round.
# Question: how much of the +5.8 survives at a fraction of the cost?
rounds = 100
games = 2
concurrency = 5
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261021
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5

[each]

[[engine]]
name = "LostFish-v2-pred-gate"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_pred_gate.yaml"
nodes = 20000
[engine.options]
Steering = true
Profile = "lc0-t1-n200"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-t1-n200"
cmd = "engines/lc0"
nodes = 200
[engine.options]
WeightsFile = "{root}/engines/lc0nets/t1-256x10-distilled-swa-2432500.pb.gz"
Threads = 1
