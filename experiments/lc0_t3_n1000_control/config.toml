# Exploitability point 4 (GPU_BOX job 4): victim lc0 T3-512x15 @1000 nodes, which beats Stockfish@20k (experiments/lc0_t3_n1000_stockfish). Same openings
# matches share srand/openings so rounds pair across matches: .venv/bin/python scripts/pair_matches.py <A> <B> --opponent lc0
# 200 rounds x 2 = 400 games each.
# Seed: v2 control (tolerance 0, never deviates; Stockfish-equivalent) at 20k nodes. Profile _generic (not lc0-t1 as on the Mac):
# the control never deviates so the proxy cannot change its moves, and skipping the lc0 proxy saves ~1.2 GB VRAM per game.
rounds = 200
games = 2
concurrency = 4
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261025
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5

[each]

[[engine]]
name = "LostFish-v2-tol0"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_tol0.yaml"
nodes = 20000
[engine.options]
Steering = true
Profile = "_generic"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-t3-n1000"
cmd = "engines/lc0"
nodes = 1000
[engine.options]
WeightsFile = "{root}/engines/lc0nets/t3-512x15x16h-distill-swa-2767500.pb.gz"
Threads = 1
BackendOptions = "max_batch=256"
