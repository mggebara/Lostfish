# Clock-safety gate (DECISIONS 2026-10-26, "how to get it ready as an engine"): the exact tree under a real
# 3+0 clock against the fixed-node victim lc0 T1@200. LostFish gets `tc`, the victim keeps `nodes`, nothing in
# [each] (an [each] nodes would override the clock). Pairs by Round with clock_3m_control (same srand).
# Pass: 0 time losses; report clock_skip / deadline_hit rates from logs/moves.jsonl and the paired margin.
rounds = 100
games = 2
concurrency = 3
openings = "experiments/openings/8moves_v3.pgn"
openings_format = "pgn"
openings_order = "random"
openings_plies = 16
srand = 20261028
ratinginterval = 20
tb = "tb/syzygy"
tbpieces = 5

[each]

[[engine]]
name = "LostFish-v2-tree2-exact-3m"
cmd = "scripts/lostfish"
args = "--config configs/variants/v2_tree2_g50.yaml"
tc = "180+0"
[engine.options]
Steering = true
Profile = "lc0-t1-n200"
Hash = 64
SyzygyPath = "{root}/tb/syzygy"

[[engine]]
name = "lc0-t1-n200"
cmd = "engines/lc0"
nodes = 200
[engine.options]
WeightsFile = "{root}/engines/lc0nets/t1-256x10-distilled-swa-2432500.pb.gz"
Threads = 1
BackendOptions = "max_batch=256"
